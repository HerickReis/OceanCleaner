spring.application.name=gateway
server.port=5051

eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:5050/eureka}
management.endpoints.web.exposure.include=health,info
# Identifica o ambiente em /actuator/info (local, staging ou production)
management.info.env.enabled=true
info.app.name=Ocean Cleaner
info.app.environment=${APP_ENV:local}
info.app.version=${APP_VERSION:dev}
