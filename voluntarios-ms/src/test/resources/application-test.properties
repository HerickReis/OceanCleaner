# Perfil usado nos testes automatizados (local e no pipeline de CI).
# Substitui o Oracle por um H2 em memória e desliga dependências externas.

spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# As migrations usam sintaxe específica do Oracle; no H2 o schema é gerado pelo Hibernate
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Não tenta registrar no Eureka durante os testes
eureka.client.enabled=false

api.security.username=test
api.security.password=test
